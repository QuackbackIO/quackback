name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  # Lets a maintainer run the nightly-only e2e jobs on any branch.
  workflow_dispatch:

concurrency:
  # The event name keeps a push to main from cancelling the nightly run.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:password@localhost:5432/quackback_test
  BETTER_AUTH_SECRET: test-secret-for-ci-only-must-be-at-least-32-characters
  BASE_URL: http://localhost:3000

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Audit production dependencies
        run: bun scripts/audit-check.ts
      - run: bun run lint
      # Build the widget bundle first — apps/web imports
      # packages/widget/dist/browser.js via Vite ?raw, so it must exist
      # before the web build runs.
      - run: bun run --filter @quackback/widget build
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      # A server function the client graph never references is left out of the
      # generated manifest, so calling it 500s at request time and only in a
      # production build. Compare the built bundle's call sites against the
      # manifest while we still have the output.
      - run: bun run --cwd apps/web check:server-fn-manifest
      # The embeddable widget's eager JavaScript (bytes, chunk count, and
      # libraries that must stay lazy) against its budget.
      - run: bun run --cwd apps/web check:widget-bundle
      - run: bun run --filter @quackback/web typecheck
      - run: bun run --cwd packages/widget typecheck
      - run: bun run --cwd packages/widget test
      - run: bun run --cwd packages/db typecheck
      - run: bunx tsc --noEmit -p packages/email/tsconfig.json

  # Four shards on four-core runners. The ~1,300-file suite was ~8–9 min of
  # wall clock on one job; splitting files is what makes the unit gate finish
  # in a couple of minutes.
  unit:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # Renderer tests use jsdom with DOMPurify, which requires a current Node runtime.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      # Drift only needs to run once; shard 1 owns it so the other three start
      # the suite immediately after migrate.
      - name: Check migration/schema drift
        if: matrix.shard == 1
        run: bun run db:check-drift
      - run: bun run test --run --shard=${{ matrix.shard }}/4 --reporter=dot --reporter=github-actions

  # Single check name so existing "test" required-status wiring still matches.
  test:
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All unit shards passed
        run: test "${{ needs.unit.result }}" = "success"

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: e2e-smoke-secret-key-for-ci-only-at-least-32-chars
      BASE_URL: http://acme.localhost:3000
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      # The seed workspace is served on the acme.localhost subdomain; make sure
      # Node-side fetches (Playwright request API, webServer readiness probe)
      # resolve it regardless of the runner's resolver.
      - name: Map acme.localhost to loopback
        run: echo "127.0.0.1 acme.localhost" | sudo tee -a /etc/hosts
      - run: bun install --frozen-lockfile
      # The dev server loads env from the repo-root .env (bun --env-file) and
      # the e2e db-helpers spawn scripts through `dotenv -e ../../.env`, so
      # materialize one for CI.
      - name: Write .env for the dev server and e2e scripts
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SECRET_KEY=$SECRET_KEY
          BASE_URL=$BASE_URL
          EOF
      # apps/web imports packages/widget/dist/browser.js via Vite ?raw — the
      # bundle must exist before the dev server starts.
      - run: bun run --filter @quackback/widget build
      - run: bun run db:migrate
      - run: bun run db:seed
      # bunx re-resolves playwright from the registry and can hang for the
      # whole job timeout. Drive the workspace binary. Cache browsers so a
      # later run skips the CDN fetch. System deps (--with-deps / apt) are
      # best-effort: a stalled apt mirror must not fail the job.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright install chromium
          if ! timeout 90 ./node_modules/.bin/playwright install-deps chromium; then
            echo '::warning::playwright install-deps timed out or failed; continuing with browser-only install'
          fi
      # Start the app and run specs in one step. A separate step's shell
      # exit SIGHUPs `vite dev` on GHA (same lesson as live-api). Waiting
      # on /api/health/ready first avoids Playwright racing a Nitro 503.
      - name: Run @smoke e2e specs
        env:
          PLAYWRIGHT_REUSE_SERVER: '1'
        run: |
          bun --env-file=.env --cwd apps/web vite dev --host 0.0.0.0 --port 3000 \
            > /tmp/quackback-e2e.log 2>&1 &
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$BASE_URL/api/health/ready" > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo '===== server log (never became ready) ====='
            cat /tmp/quackback-e2e.log
            exit 1
          fi
          # Explicit spec files (not just the tag) so an unrelated spec with a
          # load-time error can't take the smoke gate down; the setup project
          # (admin auth) still runs as a project dependency, unfiltered.
          if ! (cd apps/web && ./node_modules/.bin/playwright test \
            tests/admin/inbox.spec.ts \
            tests/admin/workflows.spec.ts \
            tests/public/portal-support.spec.ts \
            tests/widget/messenger.spec.ts \
            tests/widget/surfaces.spec.ts \
            tests/widget/identified.spec.ts \
            --grep "@smoke"); then
            echo '===== server log (playwright failed) ====='
            cat /tmp/quackback-e2e.log
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: e2e-smoke-report
          path: apps/web/blob-report
          retention-days: 7

  # Deterministic performance counts (queries, requests, JS and HTML bytes) for
  # the journeys in apps/web/perf/journeys.ts, compared with the ceilings in
  # apps/web/perf/budgets.json. A count over its ceiling fails; a count under
  # it leaves a notice to ratchet the ceiling down.
  perf:
    runs-on: ubuntu-latest
    # The build, plus about 160 journeys (the breadth sweep loads every page).
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run --filter @quackback/widget build
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright install chromium
          if ! timeout 90 ./node_modules/.bin/playwright install-deps chromium; then
            echo '::warning::playwright install-deps timed out or failed; continuing with browser-only install'
          fi
      - run: bun run --cwd apps/web perf:setup
      - run: bun run --cwd apps/web perf
      # Server-rendered pages hydrate cleanly for a visitor in another time
      # zone and locale (a date or number formatted differently on each side
      # is a hydration error).
      - run: bun run --cwd apps/web perf:hydration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: perf-results
          path: apps/web/perf/.results/latest.json
          retention-days: 14

  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CI: 'true'
      SECRET_KEY: live-api-secret-key-for-ci-only-at-least-32-characters
      BASE_URL: http://acme.localhost:3000
      API_BASE_URL: http://acme.localhost:3000/api/v1
      REQUIRE_LIVE_API: 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Map workspace hostname to loopback
        run: echo "127.0.0.1 acme.localhost" | sudo tee -a /etc/hosts
      - run: bun install --frozen-lockfile
      - run: bun run --filter @quackback/widget build
      - run: bun run db:migrate
      - run: bun run db:seed
      - name: Write runtime environment
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SECRET_KEY=$SECRET_KEY
          BASE_URL=$BASE_URL
          EOF
      - name: Provision CI API key
        run: |
          api_key=$(bun apps/web/scripts/create-ci-api-key.ts)
          echo "::add-mask::$api_key"
          echo "API_KEY=$api_key" >> "$GITHUB_ENV"
      - name: Start application and run live API assertions
        run: |
          # Bind every interface. Vite's default localhost is sometimes
          # IPv6-only while Node fetch of *.localhost uses 127.0.0.1.
          bun --env-file=.env --cwd apps/web vite dev --host 0.0.0.0 --port 3000 \
            > /tmp/quackback-live-api.log 2>&1 &
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$BASE_URL/api/health/ready" > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo '===== server log (never became ready) ====='
            cat /tmp/quackback-live-api.log
            exit 1
          fi
          if ! (cd apps/web && bunx vitest run --config vitest.config.ts \
            src/lib/server/domains/api/__tests__/api-integration.test.ts); then
            echo '===== server log (vitest failed) ====='
            cat /tmp/quackback-live-api.log
            ss -lntp || true
            exit 1
          fi

  # The whole Playwright suite, nightly and on demand (Actions > CI > Run
  # workflow). Six shards on separate runners, each with its own database,
  # migrate, seed and dev server, so no shard waits on another and every one
  # finishes well inside its time limit. Quarantined tests (@quarantine, see
  # apps/web/e2e/QUARANTINE.md) are left out here and run in e2e-quarantine.
  e2e-full:
    name: e2e-full (${{ matrix.shard }}/6)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: e2e-full-secret-key-for-ci-only-at-least-32-chars
      BASE_URL: http://acme.localhost:3000
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Map acme.localhost to loopback
        run: echo "127.0.0.1 acme.localhost" | sudo tee -a /etc/hosts
      - run: bun install --frozen-lockfile
      # Storage settings let conversation uploads work (see QUARANTINE.md).
      - name: Write .env for the dev server and e2e scripts
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SECRET_KEY=$SECRET_KEY
          BASE_URL=$BASE_URL
          S3_ENDPOINT=http://localhost:9000
          S3_BUCKET=quackback-e2e
          S3_REGION=us-east-1
          S3_ACCESS_KEY_ID=minioadmin
          S3_SECRET_ACCESS_KEY=minioadmin
          S3_FORCE_PATH_STYLE=true
          S3_PROXY=true
          EOF
      # S3-compatible object storage, the docker-compose image. A service
      # container cannot take the `server /data` command, so start it here.
      - name: Start object storage
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs storage
          exit 1
      - run: bun --env-file=.env apps/web/e2e/scripts/ensure-storage-bucket.ts
      - run: bun run --filter @quackback/widget build
      - run: bun run db:migrate
      - run: bun run db:seed
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright install chromium
          if ! timeout 90 ./node_modules/.bin/playwright install-deps chromium; then
            echo '::warning::playwright install-deps timed out or failed; continuing with browser-only install'
          fi
      # Playwright starts the dev server itself (webServer in
      # playwright.config.ts). Each shard runs the setup project (admin sign-in)
      # when any of its tests need it. One retry: a test that needs more is
      # flaky and belongs in the quarantine. The global timeout stops the run
      # before the job limit, so Playwright still writes its report.
      - name: Run shard ${{ matrix.shard }} of 6
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright test --shard=${{ matrix.shard }}/6 \
            --grep-invert @quarantine --retries=1 --global-timeout=1200000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-full-blob-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 7

  # Merges the six shard reports into one HTML report and writes the result,
  # with every failed and flaky test, to the job summary. Runs even when a
  # shard fails or is cancelled, so a bad night still leaves a report.
  e2e-full-report:
    needs: e2e-full
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: e2e-full-blob-*
          path: apps/web/all-blob-reports
          merge-multiple: true
      - name: Merge shard reports
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-full-results.json
        run: ./node_modules/.bin/playwright merge-reports --reporter html,json ./all-blob-reports
      - name: Write the job summary
        working-directory: apps/web
        run: bun e2e/scripts/summarize-report.ts e2e-full-results.json "e2e-full" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-full-report
          path: apps/web/playwright-report
          retention-days: 14

  # Runs only the quarantined tests, so the list in apps/web/e2e/QUARANTINE.md
  # shows each night which still fail and which could come back. It never
  # fails the workflow.
  e2e-quarantine:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: e2e-full-secret-key-for-ci-only-at-least-32-chars
      BASE_URL: http://acme.localhost:3000
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Map acme.localhost to loopback
        run: echo "127.0.0.1 acme.localhost" | sudo tee -a /etc/hosts
      - run: bun install --frozen-lockfile
      # Storage settings let conversation uploads work (see QUARANTINE.md).
      - name: Write .env for the dev server and e2e scripts
        run: |
          cat > .env <<EOF
          DATABASE_URL=$DATABASE_URL
          SECRET_KEY=$SECRET_KEY
          BASE_URL=$BASE_URL
          S3_ENDPOINT=http://localhost:9000
          S3_BUCKET=quackback-e2e
          S3_REGION=us-east-1
          S3_ACCESS_KEY_ID=minioadmin
          S3_SECRET_ACCESS_KEY=minioadmin
          S3_FORCE_PATH_STYLE=true
          S3_PROXY=true
          EOF
      # S3-compatible object storage, the docker-compose image. A service
      # container cannot take the `server /data` command, so start it here.
      - name: Start object storage
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs storage
          exit 1
      - run: bun --env-file=.env apps/web/e2e/scripts/ensure-storage-bucket.ts
      - run: bun run --filter @quackback/widget build
      - run: bun run db:migrate
      - run: bun run db:seed
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright install chromium
          if ! timeout 90 ./node_modules/.bin/playwright install-deps chromium; then
            echo '::warning::playwright install-deps timed out or failed; continuing with browser-only install'
          fi
      - name: Run the quarantined tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-quarantine-results.json
        run: |
          ./node_modules/.bin/playwright test --grep @quarantine --pass-with-no-tests \
            --retries=0 --global-timeout=1200000 --reporter=list,json || true
          bun e2e/scripts/summarize-report.ts e2e-quarantine-results.json \
            "Quarantined e2e tests (see apps/web/e2e/QUARANTINE.md)" --all >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Support module e2e suite (apps/web/playwright.support.config.ts). Runs on a
  # PRODUCTION build with its own environment (apps/web/e2e/support/support.env)
  # and local stand-ins: Mailpit, object storage, a fake AI server and an https
  # webhook sink. See apps/web/e2e/tests/support/README.md.
  # ---------------------------------------------------------------------------

  # The every-PR support set: tests tagged @smoke, one runner, two workers.
  support-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.29.5
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # The workspace host for the app and the webhook sink's name.
      - name: Map test hostnames to loopback
        run: echo "127.0.0.1 acme.localhost webhook-sink.localhost" | sudo tee -a /etc/hosts
      - run: bun install --frozen-lockfile
      # S3-compatible object storage, the docker-compose image. A service
      # container cannot take the `server /data` command, so start it here.
      - name: Start object storage
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs storage
          exit 1
      - run: bun run --filter @quackback/widget build
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      - run: bun run db:migrate
      - run: bun run db:seed
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright install chromium
          if ! timeout 90 ./node_modules/.bin/playwright install-deps chromium; then
            echo '::warning::playwright install-deps timed out or failed; continuing with browser-only install'
          fi
      # Playwright starts the production server, the fake AI and the sink
      # (webServer in playwright.support.config.ts).
      - name: Run support @smoke
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright test -c playwright.support.config.ts \
            --grep @smoke --grep-invert @quarantine --global-timeout=900000
      - name: Server log
        if: failure()
        run: tail -n 300 apps/web/e2e/.auth/support/app.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: support-smoke-report
          path: |
            apps/web/blob-report
            apps/web/e2e/.auth/support/app.log
          retention-days: 7

  # Decides whether a pull request runs support-core: it touches support code
  # or the suite, or carries the run-support-e2e label. Labels are read from
  # the API when the job runs, so after adding the label, re-run the workflow.
  support-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      support: ${{ steps.detect.outputs.support }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          labels=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')
          if printf '%s\n' "$labels" | grep -qx 'run-support-e2e'; then
            echo "support=true" >> "$GITHUB_OUTPUT"
            echo 'Label run-support-e2e is set.'
            exit 0
          fi
          support_paths='^(apps/web/src/lib/server/domains/(conversation|conversation-attributes|conversation-views|tickets|inbox|sla|office-hours|notifications|teams|macros|workflows|assistant|subscriptions|channel-accounts|channels)/|apps/web/src/lib/server/(realtime|events|jobs|email|e2e-harness)/|apps/web/src/routes/(admin/inbox|admin/tickets|_portal/support|widget|api/widget|api/chat|api/e2e|api/v1/conversations|api/v1/tickets)|apps/web/src/components/(admin/inbox|conversation|widget|notifications)/|apps/web/e2e/(support|tests/support|scripts)/|apps/web/playwright[.]support[.]config[.]ts|packages/(email|widget)/|[.]github/workflows/ci[.]yml)'
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$changed" | grep -Eq "$support_paths"; then
            echo "support=true" >> "$GITHUB_OUTPUT"
            echo 'Support paths changed:'
            printf '%s\n' "$changed" | grep -E "$support_paths" | head -20
          else
            echo "support=false" >> "$GITHUB_OUTPUT"
            echo 'No support paths changed and no run-support-e2e label.'
          fi

  # The wider support set: four shards, two workers each; every shard has its
  # own runner, database, build and stand-ins. PRs (see support-changes) and
  # main run @smoke and @core; nightly and manual runs run everything except
  # @quarantine.
  support-core:
    name: support-core (${{ matrix.shard }}/4)
    needs: support-changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.support-changes.outputs.support == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.29.5
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # The workspace host for the app and the webhook sink's name.
      - name: Map test hostnames to loopback
        run: echo "127.0.0.1 acme.localhost webhook-sink.localhost" | sudo tee -a /etc/hosts
      - run: bun install --frozen-lockfile
      # S3-compatible object storage, the docker-compose image. A service
      # container cannot take the `server /data` command, so start it here.
      - name: Start object storage
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:9000/minio/health/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs storage
          exit 1
      - run: bun run --filter @quackback/widget build
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      - run: bun run db:migrate
      - run: bun run db:seed
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright install chromium
          if ! timeout 90 ./node_modules/.bin/playwright install-deps chromium; then
            echo '::warning::playwright install-deps timed out or failed; continuing with browser-only install'
          fi
      - name: Run shard ${{ matrix.shard }} of 4
        working-directory: apps/web
        env:
          FULL_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          grep_args=(--grep '@smoke|@core')
          if [ "$FULL_RUN" = 'true' ]; then grep_args=(); fi
          # A shard can be empty while the suite is small; the report job
          # fails the run when no shard ran a test.
          ./node_modules/.bin/playwright test -c playwright.support.config.ts \
            --shard=${{ matrix.shard }}/4 "${grep_args[@]}" --grep-invert @quarantine \
            --pass-with-no-tests --global-timeout=1500000
      - name: Server log
        if: failure()
        run: tail -n 300 apps/web/e2e/.auth/support/app.log || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: support-core-blob-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: support-core-server-log-${{ matrix.shard }}
          path: apps/web/e2e/.auth/support/app.log
          retention-days: 7

  # Merges the support-core shard reports, writes the job summary, and fails
  # when no test ran at all (every shard empty means a broken grep, not a pass).
  support-core-report:
    needs: support-core
    if: ${{ !cancelled() && needs.support-core.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: support-core-blob-*
          path: apps/web/all-blob-reports
          merge-multiple: true
      - name: Merge shard reports
        working-directory: apps/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: support-core-results.json
        run: ./node_modules/.bin/playwright merge-reports --reporter html,json ./all-blob-reports
      - name: Write the job summary
        working-directory: apps/web
        run: |
          bun e2e/scripts/summarize-report.ts support-core-results.json "support-core" \
            --fail-if-empty >> "$GITHUB_STEP_SUMMARY"
      - name: Every shard passed
        run: test "${{ needs.support-core.result }}" = "success"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: support-core-report
          path: apps/web/playwright-report
          retention-days: 14
