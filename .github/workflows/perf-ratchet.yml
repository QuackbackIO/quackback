name: Performance ratchet

# Once a day, measure the perf journeys on main and lower every ceiling in
# apps/web/perf/budgets.json that a journey now comes in under, as a pull
# request. Ceilings only ever move down here, so an improvement that lands is
# locked in and a later change cannot quietly spend it.

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

concurrency:
  group: perf-ratchet
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: quackback_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run --filter @quackback/widget build
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium
        timeout-minutes: 8
        working-directory: apps/web
        run: |
          ./node_modules/.bin/playwright install chromium
          if ! timeout 90 ./node_modules/.bin/playwright install-deps chromium; then
            echo '::warning::playwright install-deps timed out or failed; continuing with browser-only install'
          fi
      - run: bun run --cwd apps/web perf:setup
      # Three runs: a ceiling is only lowered for a count that came out the
      # same every time.
      - run: bun run --cwd apps/web perf --repeat 3 --update
      - name: Open or update the ratchet pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- apps/web/perf/budgets.json; then
            echo 'No ceiling moved.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c perf/ratchet
          git add apps/web/perf/budgets.json
          git commit -m 'perf: lower performance ceilings to current counts'
          git push --force origin HEAD:refs/heads/perf/ratchet
          if ! gh pr view perf/ratchet --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr create --base main --head perf/ratchet \
              --title 'perf: lower performance ceilings to current counts' \
              --body 'Journeys in apps/web/perf/journeys.ts now come in under their ceilings. This lowers each ceiling to the measured count so the improvement cannot be spent silently. Generated by the daily performance ratchet.'
          fi
